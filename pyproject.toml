[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pyborehole"
version = "0.2.0"
description = "Borehole backfill effect on resistivity (ERT), induction (EM) and natural gamma-ray logs"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Marios Karaoulis" }]
keywords = ["borehole", "well logging", "ERT", "electromagnetics", "gamma ray", "Geant4", "geophysics"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Physics",
    "Intended Audience :: Science/Research",
]
# Core: the shared model, the gamma-ray wrapper and the analytic solutions.
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pandas>=2.0",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
# ERT (PyGIMLi). If PyGIMLi is already installed with conda, do not use this
# extra: install "pyborehole[em,test]" and add pyvista if missing.
ert = ["pygimli>=1.5", "pyvista>=0.43"]
em = ["simpeg>=0.22", "discretize>=0.10"]
test = ["pytest>=7.0"]
all = ["pyborehole[ert,em,test]"]

[project.urls]
Homepage = "https://github.com/mariosgeo/PyBorehole"
Documentation = "https://github.com/mariosgeo/PyBorehole/blob/main/docs/INSTALL.md"

[project.scripts]
# Compile the Geant4 gamma-ray program after installing (needs Geant4 + a C++ compiler)
pyborehole-build-gamma = "geometry_class.gamma_geometry:build_gammalog_main"

[tool.setuptools]
packages = ["geometry_class", "geometry_class.gamma"]

[tool.setuptools.package-data]
"geometry_class.gamma" = ["*.cc", "CMakeLists.txt", "build.bat", "build.sh", "*.py"]
